[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.91"
repository = "https://github.com/Mntcrl/IHX26"

# Every version is pinned exactly (`=x.y.z`); see docs/adr/0002-shared-rust-core.md
# for the selection evidence. Defaults are disabled where they pull in
# platform-sensitive code (threads, SIMD, native TLS); members opt into features.
[workspace.dependencies]
# Internal crates
galaxy-protocol = { path = "crates/galaxy-protocol" }
galaxy-crypto = { path = "crates/galaxy-crypto" }
galaxy-image = { path = "crates/galaxy-image" }
galaxy-evidence = { path = "crates/galaxy-evidence" }
galaxy-geometry = { path = "crates/galaxy-geometry" }
galaxy-witness = { path = "crates/galaxy-witness" }
galaxy-attestation = { path = "crates/galaxy-attestation" }
galaxy-xrpl = { path = "crates/galaxy-xrpl" }
galaxy-prover = { path = "crates/galaxy-prover" }
galaxy-verifier = { path = "crates/galaxy-verifier" }

# Poseidon + arkworks (all on the arkworks 0.6 line required by light-poseidon 0.5.0)
light-poseidon = "=0.5.0"
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-ec = "=0.6.0"
ark-groth16 = { version = "=0.6.0", default-features = false }
ark-poly = { version = "=0.6.0", default-features = false }
ark-serialize = "=0.6.0"
ark-std = { version = "=0.6.0", default-features = false }
ark-relations = "=0.6.0"
num-bigint = "=0.4.8"

# Proving utilities
circom-witnesscalc = "=0.3.0"
memmap2 = "=0.9.12"
rayon = "=1.12.0"

# Geometry
ethnum = "=1.5.3"
libm = "=0.2.16"

# Serialization / encoding
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
hex = "=0.4.3"
bs58 = "=0.5.1"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
ciborium = "=0.2.2"
quick-xml = "=0.41.0"
toml = { version = "=1.2.1", default-features = false }
time = { version = "=0.3.47", default-features = false }
thiserror = "=2.0.21"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

# RustCrypto (digest 0.11 generation) and randomness
sha2 = "=0.11.1"
ripemd = "=0.2.0"
p256 = { version = "=0.14.0", default-features = false }
p384 = { version = "=0.14.0", default-features = false }
ed25519-dalek = "=3.0.0"
x509-cert = "=0.3.1"
der = "=0.8.3"
rand_core = "=0.10.1"
getrandom = "=0.4.3"
zeroize = "=1.9.2"

# Images (scalar, platform-independent JPEG paths per spec §4)
png = "=0.18.1"
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent"] }
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
crc32fast = "=1.5.0"
flate2 = { version = "=1.1.9", default-features = false }
zune-core = { version = "=0.4.12", default-features = false }
zune-jpeg = { version = "=0.4.21", default-features = false }

# Native networking / services
tokio = "=1.54.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "=0.3.34"
url = "=2.5.8"
axum = "=0.8.9"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
clap = { version = "=4.6.9", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Language surfaces
uniffi = "=0.32.2"
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"

# Test utilities
tempfile = "=3.27.0"
wasm-bindgen-test = "=0.3.80"
