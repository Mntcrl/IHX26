<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-labelledby="title description">
  <title id="title">The ledger challenge comes after the commitment</title>
  <desc id="description">At L0, the CAPTURE commits to the evidence. At L0 plus five, a validated ledger hash selects the sample. After the challenge, a PROOF publishes the result of the on-device proof.</desc>
  <rect x=".5" y=".5" width="879" height="199" rx="16" fill="#16171b" stroke="#373841"/>
  <path d="M152 100h576" stroke="#777480" stroke-width="2"/>
  <path d="M440 100h288" stroke="#eac584" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#16171b" stroke="#eac584" stroke-width="2">
    <circle cx="152" cy="100" r="8"/>
    <circle cx="728" cy="100" r="8"/>
  </g>
  <circle cx="440" cy="100" r="8" fill="#eac584"/>
  <g text-anchor="middle" font-family="system-ui, sans-serif">
    <g fill="#f4f1e9" font-size="20" font-weight="700">
      <text x="152" y="68">CAPTURE</text>
      <text x="440" y="68">CHALLENGE</text>
      <text x="728" y="68">PROOF</text>
    </g>
    <g fill="#eac584" font-family="monospace" font-size="15">
      <text x="152" y="134">L0</text>
      <text x="440" y="134">L0 + 5</text>
      <text x="728" y="134">AFTER CHALLENGE</text>
    </g>
    <g fill="#d0ced4" font-size="15">
      <text x="152" y="161">Commit to evidence</text>
      <text x="440" y="161">Use validated ledger hash</text>
      <text x="728" y="161">Publish phone-generated proof</text>
    </g>
  </g>
</svg>
