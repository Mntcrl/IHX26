[package]
name = "galaxy-image"
version = "0.1.0"
description = "XRPL Galaxy: galaxy-image"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
crc32fast = "=1.5.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
galaxy-crypto.workspace = true
galaxy-protocol.workspace = true
jpeg-encoder.workspace = true
png.workspace = true
serde.workspace = true
thiserror.workspace = true
zune-core = { version = "=0.4.12", default-features = false }
zune-jpeg = { version = "=0.4.21", default-features = false }

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
