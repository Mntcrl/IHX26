[package]
name = "galaxy-ffi"
version = "0.1.0"
description = "XRPL Galaxy: galaxy-ffi"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[features]
uniffi-cli = ["uniffi/cli"]

[dependencies]
galaxy-attestation.workspace = true
galaxy-crypto.workspace = true
galaxy-evidence.workspace = true
galaxy-geometry.workspace = true
galaxy-image.workspace = true
galaxy-protocol.workspace = true
galaxy-prover.workspace = true
galaxy-witness.workspace = true
galaxy-xrpl.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true
zeroize.workspace = true

[dev-dependencies]
galaxy-verifier.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "galaxy-ffi-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["uniffi-cli"]
