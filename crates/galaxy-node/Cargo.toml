[package]
name = "galaxy-node"
version = "0.1.0"
description = "XRPL Galaxy: galaxy-node"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-faults = []

[dependencies]
galaxy-attestation.workspace = true
galaxy-protocol.workspace = true
galaxy-verifier.workspace = true
galaxy-xrpl = { workspace = true, features = ["native"] }
axum.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
toml = { workspace = true, features = ["default"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "galaxy-node"
path = "src/main.rs"
